name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tasas.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Los runners ubuntu-latest ya traen el SDK con android-34 y build-tools 34.
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          ls "$ANDROID_HOME/platforms" | tr '\n' ' '; echo
          ls "$ANDROID_HOME/build-tools" | tr '\n' ' '; echo

      - name: Install Capacitor 6
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f tasas.json ]; then cp tasas.json www/tasas.json; fi

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanBCV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
