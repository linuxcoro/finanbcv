name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tasas.json'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK debug con AdMob
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Capacitor 8 compila con android-36 y build-tools 36.0.0.
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          ls "$ANDROID_HOME/platforms" | tr '\n' ' '; echo
          ls "$ANDROID_HOME/build-tools" | tr '\n' ' '; echo

      - name: Install Capacitor 8 + plugins
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/share@8 @capacitor-community/admob@8.3.0

      - name: Prepare web assets
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          BCV_TASAS_PAT: ${{ secrets.BCV_TASAS_PAT }}
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/index.html
          if [ -f tasas.json ]; then cp tasas.json www/tasas.json; fi
          # Inyecta el PAT de solo lectura de GitHub en la copia que va al APK.
          node scripts/inject-rates-token.mjs
          # Falla si el marcador sobrevivió o si falta la línea que usa el token.
          if grep -q '__RATES_PAT__' www/index.html; then
            echo "::error::www/index.html conserva el marcador __RATES_PAT__; el PAT no se inyectó."
            exit 1
          fi
          grep -q "const RATES_TOKEN = '" www/index.html
          # Genera www/ads-config.js (IDs de prueba por defecto o los de las variables del repo).
          node scripts/admob-build-config.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Configurar AdMob en el proyecto Android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
        run: |
          # Parchea AndroidManifest.xml y strings.xml con el App ID de AdMob.
          node scripts/admob-build-config.mjs

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar integración de AdMob en el APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          MANIFEST_TXT="$(mktemp)"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          if ! "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > "$MANIFEST_TXT" 2>/dev/null; then
            unzip -p "$APK" AndroidManifest.xml | strings > "$MANIFEST_TXT"
          fi
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$MANIFEST_TXT"

          unzip -p "$APK" assets/capacitor.plugins.json | grep -q '@capacitor-community/admob'
          unzip -p "$APK" assets/public/ads-config.js | grep -q 'FINANBCV_ADS'

          # El APK no debe llevar el marcador: la copia compilada debe tener el PAT.
          if unzip -p "$APK" assets/public/index.html | grep -q '__RATES_PAT__'; then
            echo "::error::El APK contiene el marcador __RATES_PAT__; el PAT no se inyectó."
            exit 1
          fi
          unzip -p "$APK" assets/public/index.html | grep -q "const RATES_TOKEN = '"

          echo "APK con AdMob verificado: $(stat -c%s "$APK") bytes"

      # El APK contiene el PAT BCV_TASAS_PAT: no compartas este artifact.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanBCV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
