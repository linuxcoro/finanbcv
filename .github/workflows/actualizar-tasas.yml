name: Actualizar tasas BCV

on:
  schedule:
    # Cada hora, minuto 5 (UTC). GitHub puede retrasar la ejecución.
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-tasas
  cancel-in-progress: false

jobs:
  actualizar:
    name: Regenerar tasas.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-tasas.txt

      - name: Instalar dependencias
        run: pip install -r requirements-tasas.txt

      - name: Extraer tasas del BCV
        run: |
          set -euo pipefail
          python3 bcv_scraper.py > tasas.json
          python3 -m json.tool tasas.json > /dev/null

      - name: Guardar tasas.json en el repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tasas.json; then
            echo "tasas.json sin cambios; no se crea commit."
            exit 0
          fi
          git add tasas.json
          git commit -m "chore: actualizar tasas BCV"
          git push
